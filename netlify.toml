# Netlify: use npm (package-lock.json). Do not use the stale pnpm-lock.yaml.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Force npm even if a pnpm lockfile is reintroduced by mistake
  NPM_FLAGS = "--no-fund --no-audit"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 确保 pdf.js worker 进入函数运行时（配合 next.config outputFileTracingIncludes）
[functions]
  included_files = [
    "node_modules/pdfjs-dist/legacy/build/**",
    "node_modules/pdfjs-dist/build/**",
    "node_modules/pdf-parse/dist/**",
  ]
